services:
  - type: web
    name: cheat-cards-server
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:asgi_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Set this to your deployed client's URL(s) once you know them, e.g.
      # https://cheat-cards.vercel.app — comma-separated for multiple.
      # Left as "*" (open) until you do; tighten it before sharing widely.
      - key: CORS_ORIGINS
        value: "*"
